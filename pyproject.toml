[project]
name = "kitchensink4ppt"
version = "1.1.0"
description = "Everything plus the kitchen sink for Microsoft PowerPoint - a .pptx MCP server engineered not to corrupt: atomic validated saves, slot backups, native vector graphics as editable PowerPoint shapes"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "nometalalchemist" }]
keywords = [
    "mcp", "powerpoint", "pptx", "ooxml", "claude", "model-context-protocol",
    "presentations", "slides", "shapes", "svg", "vector-graphics", "tables",
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14,<3",  # Tool.enable()/disable() queue tools/list_changed (tiered loading relies on it; verified on 2.14.7)
    "lxml",
    "regex",
    "svgelements>=1.9",
    "latex2mathml>=3.81",   # LaTeX -> MathML (equations pipeline, same as word-mcp)
    "mathml2omml>=0.0.2",   # MathML -> OMML (equations pipeline, same as word-mcp)
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "python-pptx",  # test oracle and synthetic corpus generation only, never a runtime dependency
]
optimize = [
    "Pillow",  # compress_deck image downsampling only; without it the purge half still works and recompression is refused honestly
]

[project.scripts]
ppt-mcp = "kitchensink4ppt.server:main"
kitchensink4ppt = "kitchensink4ppt.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
# Without the plugin installed, every timeout= setting and
# @pytest.mark.timeout in the suite goes silently inert, which is how a COM
# hang once ran unbounded during a field round. Fail the run instead.
required_plugins = ["pytest-timeout"]
markers = [
    "live: needs an interactive PowerPoint instance (auto-skipped where PowerPoint is unavailable)",
]
